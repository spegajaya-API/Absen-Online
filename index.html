<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Absensi Digital</title>
  
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #f4f6f9;
      color: #333;
    }
    .navbar-brand {
      font-weight: 700;
      color: #0d6efd !important;
    }
    .card-custom {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      background: #ffffff;
    }
    .btn-kelas {
      border-radius: 12px;
      padding: 15px;
      font-weight: 600;
      transition: all 0.2s ease;
      background: #ffffff;
      border: 2px solid #e9ecef;
      color: #495057;
    }
    .btn-kelas:hover {
      border-color: #0d6efd;
      color: #0d6efd;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
    }
    .table thead {
      background-color: #1e293b;
      color: #ffffff;
    }
    .table th {
      font-weight: 600;
      border: none;
    }
    
    /* ANIMASI SPINNER MINI UNTUK TOMBOL */
    .btn-loading {
      position: relative;
      pointer-events: none; /* Mencegah klik ganda saat proses */
      opacity: 0.8;
    }
    .spinner-mini {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white py-3 shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <span class="fs-3">🏫</span>
        <span>Sistem Absensi Digital</span>
      </a>
      <div class="d-flex gap-2">
        <button class="btn btn-primary rounded-pill px-3 fw-semibold" onclick="showSection('pilihanKelas')">
          <i class="bi bi-pencil-square me-1"></i> Absensi Kelas
        </button>
        <button class="btn btn-outline-secondary rounded-pill px-3 fw-semibold" onclick="showSection('rekapData')">
          <i class="bi bi-bar-chart-line me-1"></i> Rekap Data
        </button>
      </div>
    </div>
  </nav>

  <div class="container py-4">

    <!-- SECTION 1: PILIHAN KELAS -->
    <div id="secPilihanKelas" class="section-view">
      <div class="card card-custom p-4 mb-4">
        <h4 class="fw-bold mb-3"><i class="bi bi-grid-3x3-gap-fill text-primary me-2"></i>Pilih Kelas</h4>
        <p class="text-muted">Pilih kelas untuk mulai melakukan absensi siswa hari ini.</p>
        <div class="row g-3" id="containerDaftarKelas">
          <!-- Daftar kelas akan dimuat secara dinamis atau statis -->
          <div class="col-6 col-md-4 col-lg-3"><button class="btn btn-kelas w-100" onclick="bukaKelas('7A')">Kelas 7A</button></div>
          <div class="col-6 col-md-4 col-lg-3"><button class="btn btn-kelas w-100" onclick="bukaKelas('7B')">Kelas 7B</button></div>
          <div class="col-6 col-md-4 col-lg-3"><button class="btn btn-kelas w-100" onclick="bukaKelas('8A')">Kelas 8A</button></div>
          <div class="col-6 col-md-4 col-lg-3"><button class="btn btn-kelas w-100" onclick="bukaKelas('8B')">Kelas 8B</button></div>
        </div>
      </div>
    </div>

    <!-- SECTION 2: DAFTAR SISWA KELAS (ABSENSI) -->
    <div id="secDaftarSiswa" class="section-view d-none">
      <div class="card card-custom p-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <div>
            <h4 class="fw-bold m-0" id="judulKelas">Daftar Siswa</h4>
            <small class="text-muted">Klik tombol "Absen" pada nama siswa secara berurutan.</small>
          </div>
          <button class="btn btn-secondary rounded-pill px-3" onclick="showSection('pilihanKelas')">
            <i class="bi bi-arrow-left me-1"></i> Kembali ke Pilihan Kelas
          </button>
        </div>

        <!-- Filter Pencarian Siswa -->
        <div class="mb-3">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="cariSiswaInput" class="form-control border-start-0" placeholder="Cari nama siswa..." onkeyup="filterSiswa()">
          </div>
        </div>

        <!-- Tabel Daftar Siswa -->
        <div class="table-responsive rounded-3 border">
          <table class="table table-hover align-middle m-0">
            <thead>
              <tr>
                <th class="text-center" style="width: 80px;">No</th>
                <th>Nama Siswa</th>
                <th>No. WA Wali</th>
                <th class="text-center" style="width: 200px;">Aksi Absen</th>
              </tr>
            </thead>
            <tbody id="tabelSiswaBody">
              <!-- Data siswa diproses via JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- SECTION 3: REKAP DATA -->
    <div id="secRekapData" class="section-view d-none">
      <div class="card card-custom p-4">
        <h4 class="fw-bold mb-3"><i class="bi bi-file-earmark-bar-graph text-primary me-2"></i>Rekap Absensi</h4>
        <p class="text-muted">Fitur rekapitulasi data kehadiran siswa.</p>
        <!-- Konten Rekap Kamu Bisa Ditaruh Di Sini -->
      </div>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // URL Deployment Apps Script Kamu
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrlB-R1zkZB1cXMFtSK7hY_vFpVFgYS8tMZFn1XDc5sDqiuFHjbuiJprC2vfsnwEaK/exec";

    var currentDataSiswa = [];

    // Fungsi Navigasi Halaman Halaman (SPA)
    function showSection(sectionName) {
      document.querySelectorAll('.section-view').forEach(el => el.classList.add('d-none'));
      if (sectionName === 'pilihanKelas') {
        document.getElementById('secPilihanKelas').classList.remove('d-none');
      } else if (sectionName === 'daftarSiswa') {
        document.getElementById('secDaftarSiswa').classList.remove('d-none');
      } else if (sectionName === 'rekapData') {
        document.getElementById('secRekapData').classList.remove('d-none');
      }
    }

    // Fungsi Membuka Kelas & Fetch Siswa dari Apps Script
    function bukaKelas(namaKelas) {
      document.getElementById('judulKelas').innerText = "Daftar Siswa " + namaKelas;
      showSection('daftarSiswa');
      
      var tbody = document.getElementById("tabelSiswaBody");
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span> Memuat data siswa...</td></tr>`;

      fetch(`${SCRIPT_URL}?action=getSiswaByKelas&kelas=${encodeURIComponent(namaKelas)}`)
        .then(response => response.json())
        .then(data => {
          currentDataSiswa = data;
          renderDaftarSiswa(currentDataSiswa);
        })
        .catch(err => {
          console.error(err);
          tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger">Gagal memuat data siswa. Pastikan URL Apps Script sudah benar.</td></tr>`;
        });
    }

    // Render Tabel Daftar Siswa
    function renderDaftarSiswa(daftar) {
      var tbody = document.getElementById("tabelSiswaBody");
      tbody.innerHTML = "";

      if (!daftar || daftar.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">Belum ada siswa terdaftar di kelas ini.</td></tr>`;
        return;
      }

      daftar.forEach(function (siswa, index) {
        var row = document.createElement("tr");
        row.innerHTML = `
          <td class="text-center fw-semibold">${index + 1}</td>
          <td class="fw-semibold">${siswa.nama}</td>
          <td>${siswa.nomorHP || '-'}</td>
          <td class="text-center" id="action-cell-${index}">
            <button class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm" onclick="absenSiswa('${siswa.nama}', '${siswa.kelas}', '${siswa.nomorHP}', ${index}, this)">
              <i class="bi bi-check-circle me-1"></i> Absen
            </button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // FUNGSI UTAMA: Absen Cepat Tanpa Reload Halaman
    function absenSiswa(nama, kelas, nomorHP, index, btnElement) {
      // 1. Kunci tombol dan ganti tampilan ke indikator loading mini secara instant
      var originalHTML = btnElement.innerHTML;
      btnElement.classList.add("btn-loading");
      btnElement.disabled = true;
      btnElement.innerHTML = `<span class="spinner-mini"></span> Menyimpan...`;

      // 2. Kirim data ke Google Apps Script di background (Asynchronous)
      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "simpanAbsenOtomatis",
          nama: nama,
          kelas: kelas,
          nomorHP: nomorHP
        })
      })
      .then(response => response.json())
      .then(data => {
        // 3. Setelah sukses, langsung ubah tombol menjadi Badge Status Kehadiran
        var cell = document.getElementById(`action-cell-${index}`);
        if (data.status === "Tepat Waktu") {
          cell.innerHTML = `<span class="badge bg-success-subtle text-success border border-success px-3 py-2 rounded-pill"><i class="bi bi-check-lg me-1"></i> Tepat Waktu</span>`;
        } else {
          cell.innerHTML = `<span class="badge bg-warning-subtle text-warning border border-warning px-3 py-2 rounded-pill"><i class="bi bi-exclamation-triangle me-1"></i> Terlambat</span>`;
        }
      })
      .catch(error => {
        console.error("Error:", error);
        // Jika koneksi gagal, kembalikan tombol ke kondisi awal agar bisa diklik lagi
        btnElement.classList.remove("btn-loading");
        btnElement.disabled = false;
        btnElement.innerHTML = originalHTML;
        alert("Gagal mencatat absensi " + nama + ". Silakan periksa koneksi dan coba lagi.");
      });
    }

    // Filter Cari Siswa
    function filterSiswa() {
      var query = document.getElementById("cariSiswaInput").value.toLowerCase();
      var filtered = currentDataSiswa.filter(function(siswa) {
        return siswa.nama.toLowerCase().includes(query);
      });
      renderDaftarSiswa(filtered);
    }
  </script>
</body>
</html>
