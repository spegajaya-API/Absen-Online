<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Absensi Online</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1"><i class="bi bi-calendar-check-fill me-2"></i>Absensi Online</span>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Section Pilih Kelas -->
    <div id="sectionPilihKelas" class="card shadow-sm p-4">
      <h3 class="mb-3 text-secondary">Pilih Kelas</h3>
      <div id="daftarKelasContainer" class="row g-3">
        <!-- Tombol kelas akan dimuat di sini secara dinamis -->
        <div class="text-center py-3 text-muted">Memuat daftar kelas...</div>
      </div>
    </div>

    <!-- Section Daftar Siswa -->
    <div id="sectionDaftarSiswa" class="card shadow-sm p-4 hidden">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 id="judulKelas" class="text-secondary m-0">Daftar Siswa</h3>
        <button class="btn btn-secondary btn-sm" onclick="showSection('pilihKelas')">
          <i class="bi bi-arrow-left me-1"></i>Kembali
        </button>
      </div>
      
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th style="width: 5%;">No</th>
              <th style="width: 35%;">Nama Siswa</th>
              <th style="width: 25%;">No. WA Wali</th>
              <th style="width: 35%;">Aksi Kehadiran</th>
            </tr>
          </thead>
          <tbody id="tabelSiswaBody">
            <!-- Data siswa dimuat di sini -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Ganti dengan URL Web App Google Apps Script kamu
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwrlB-R1zkZB1cXMFtSK7hY_vFpVFgYS8tMZFn1XDc5sDqiuFHjbuiJprC2vfsnwEaK/exec";

    let activeKelasGlobal = "";
    let currentDataSiswa = [];

    document.addEventListener("DOMContentLoaded", function() {
      loadDaftarKelas();
    });

    function showSection(section) {
      document.getElementById('sectionPilihKelas').classList.add('hidden');
      document.getElementById('sectionDaftarSiswa').classList.add('hidden');

      if (section === 'pilihKelas') {
        document.getElementById('sectionPilihKelas').classList.remove('hidden');
      } else if (section === 'daftarSiswa') {
        document.getElementById('sectionDaftarSiswa').classList.remove('hidden');
      }
    }

    function getTodayString() {
      const d = new Date();
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    async function loadDaftarKelas() {
      const container = document.getElementById('daftarKelasContainer');
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getKelas`);
        const kelasList = await res.json();
        
        container.innerHTML = "";
        if (kelasList.length === 0) {
          container.innerHTML = `<div class="col-12 text-muted">Tidak ada data kelas.</div>`;
          return;
        }

        kelasList.forEach(kelas => {
          container.innerHTML += `
            <div class="col-md-4">
              <div class="card border-primary h-100 shadow-sm cursor-pointer" onclick="bukaKelas('${kelas}')" style="cursor: pointer;">
                <div class="card-body text-center py-4">
                  <h4 class="card-title text-primary mb-0"><i class="bi bi-door-open me-2"></i>Kelas ${kelas}</h4>
                </div>
              </div>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = `<div class="col-12 text-danger">Gagal memuat daftar kelas.</div>`;
      }
    }

    async function bukaKelas(namaKelas) {
      activeKelasGlobal = namaKelas;
      document.getElementById('judulKelas').innerText = "Daftar Siswa Kelas " + namaKelas;
      showSection('daftarSiswa');
      
      const tbody = document.getElementById("tabelSiswaBody");
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted"><span class="spinner-border spinner-border-sm me-2"></span> Memuat data...</td></tr>`;
      
      try {
        // 1. Cek status libur hari ini terlebih dahulu
        const todayStr = getTodayString();
        const resLibur = await fetch(`${SCRIPT_URL}?action=cekLibur&tanggal=${todayStr}`);
        const dataLibur = await resLibur.json();

        if (dataLibur.status) {
          tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Absensi dikunci karena hari ini libur: ${dataLibur.keterangan}</td></tr>`;
          return; // Hentikan proses render tombol jika libur
        }

        // 2. Jika tidak libur, muat data siswa dan render tombol aksi
        const resSiswa = await fetch(`${SCRIPT_URL}?action=getSiswaByKelas&kelas=${encodeURIComponent(namaKelas)}`);
        currentDataSiswa = await resSiswa.json();
        renderDaftarSiswa(currentDataSiswa);
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-danger">Gagal memuat data.</td></tr>`;
      }
    }

    function renderDaftarSiswa(dataSiswa) {
      const tbody = document.getElementById("tabelSiswaBody");
      tbody.innerHTML = "";

      if (dataSiswa.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4 text-muted">Tidak ada siswa di kelas ini.</td></tr>`;
        return;
      }

      dataSiswa.forEach((siswa, index) => {
        tbody.innerHTML += `
          <tr>
            <td>${index + 1}</td>
            <td class="fw-semibold">${siswa.nama}</td>
            <td>${siswa.wa || '-'}</td>
            <td>
              <button class="btn btn-sm btn-outline-success me-1" onclick="kirimAbsen('${siswa.id}', 'Hadir')">Hadir</button>
              <button class="btn btn-sm btn-outline-info me-1" onclick="kirimAbsen('${siswa.id}', 'Sakit')">Sakit</button>
              <button class="btn btn-sm btn-outline-warning me-1" onclick="kirimAbsen('${siswa.id}', 'Izin')">Izin</button>
              <button class="btn btn-sm btn-outline-danger" onclick="kirimAbsen('${siswa.id}', 'Alpa')">Alpa</button>
            </td>
          </tr>
        `;
      });
    }

    async function kirimAbsen(idSiswa, status) {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=absen&id=${idSiswa}&status=${status}`);
        const hasil = await res.json();
        if (hasil.success) {
          alert("Absen berhasil dicatat: " + status);
        } else {
          alert("Gagal: " + hasil.message);
        }
      } catch (err) {
        alert("Terjadi kesalahan koneksi.");
      }
    }
  </script>
</body>
</html>
